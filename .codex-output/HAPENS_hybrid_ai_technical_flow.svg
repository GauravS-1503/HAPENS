<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HAPENS hybrid AI technical flow</title>
  <desc id="desc">A technical architecture diagram for HAPENS showing patient and staff access, secure entry, backend services, hospital data systems, governance controls, local AI hosting, optional cloud PHI AI hosting, and hospital operations.</desc>
  <defs>
    <style>
      .bg { fill: #f5fbfa; }
      .title { font: 700 44px Arial, sans-serif; fill: #073b3a; letter-spacing: .4px; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #426462; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #073b3a; }
      .node-title { font: 700 19px Arial, sans-serif; fill: #073b3a; }
      .node-text { font: 400 15px Arial, sans-serif; fill: #2f4f4d; }
      .small { font: 400 13px Arial, sans-serif; fill: #466966; }
      .stack { font: 700 16px Arial, sans-serif; fill: #0b615e; }
      .tag { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #b9d8d5; stroke-width: 2; }
      .card-soft { fill: #ebf7f4; stroke: #91c7c2; stroke-width: 2; }
      .card-data { fill: #fff8e8; stroke: #e0c66f; stroke-width: 2; }
      .card-local { fill: #eef4ff; stroke: #8fb1e8; stroke-width: 2; }
      .card-cloud { fill: #f2efff; stroke: #a99be8; stroke-width: 2; }
      .card-govern { fill: #fff2ee; stroke: #eea189; stroke-width: 2; }
      .pill { fill: #0b615e; }
      .pill-blue { fill: #1d75a3; }
      .pill-purple { fill: #6858ad; }
      .pill-orange { fill: #b95635; }
      .arrow { fill: none; stroke: #0b615e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
      .arrow-soft { fill: none; stroke: #7aa9a5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead-soft); }
      .arrow-purple { fill: none; stroke: #6858ad; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead-purple); }
      .divider { stroke: #d5e7e5; stroke-width: 2; stroke-dasharray: 7 9; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0b615e"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7aa9a5"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6858ad"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b615e" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="78">HAPENS Hybrid AI Technical Flow</text>
  <text class="subtitle" x="70" y="116">Local hospital hosting by default, with optional governed cloud PHI AI for advanced assistance</text>
  <rect class="pill" x="1200" y="50" width="330" height="40" rx="20"/>
  <text class="tag" x="1235" y="75">Dual deployment: local or cloud PHI</text>

  <line class="divider" x1="285" y1="160" x2="285" y2="778"/>
  <line class="divider" x1="520" y1="160" x2="520" y2="778"/>
  <line class="divider" x1="765" y1="160" x2="765" y2="778"/>
  <line class="divider" x1="1015" y1="160" x2="1015" y2="778"/>
  <line class="divider" x1="1275" y1="160" x2="1275" y2="778"/>

  <text class="lane-title" x="62" y="176">1. Access Layer</text>
  <text class="lane-title" x="318" y="176">2. Secure Entry</text>
  <text class="lane-title" x="553" y="176">3. Backend Services</text>
  <text class="lane-title" x="800" y="176">4. Data + Governance</text>
  <text class="lane-title" x="1048" y="176">5. AI Deployment Options</text>
  <text class="lane-title" x="1308" y="176">6. Hospital Operations</text>

  <g filter="url(#shadow)">
    <rect class="card" x="60" y="220" width="190" height="108" rx="17"/>
    <text class="node-title" x="88" y="254">Patient app</text>
    <text class="node-text" x="88" y="284">Mobile web / PWA</text>
    <text class="small" x="88" y="309">HTML, CSS, JS</text>

    <rect class="card" x="60" y="360" width="190" height="108" rx="17"/>
    <text class="node-title" x="88" y="394">Admin console</text>
    <text class="node-text" x="88" y="424">Registration, slots,</text>
    <text class="node-text" x="88" y="450">tokens, diagnostics</text>

    <rect class="card" x="60" y="500" width="190" height="108" rx="17"/>
    <text class="node-title" x="88" y="534">Screens / kiosk</text>
    <text class="node-text" x="88" y="564">Token calling and</text>
    <text class="node-text" x="88" y="590">wayfinding display</text>

    <rect class="card-soft" x="318" y="278" width="170" height="164" rx="18"/>
    <text class="node-title" x="344" y="314">API gateway</text>
    <text class="node-text" x="344" y="348">Nginx / WAF</text>
    <text class="node-text" x="344" y="376">Rate limits</text>
    <text class="node-text" x="344" y="404">Hospital VLAN</text>
    <text class="small" x="344" y="430">DMZ entry point</text>

    <rect class="card-soft" x="555" y="215" width="180" height="430" rx="22"/>
    <text class="node-title" x="585" y="252">FastAPI core</text>
    <text class="node-text" x="585" y="286">Gunicorn + Uvicorn</text>
    <text class="small" x="585" y="312">Python 3.11</text>
    <line x1="585" y1="334" x2="705" y2="334" stroke="#cfe3e0" stroke-width="2"/>
    <text class="node-text" x="585" y="366">Auth + enrolment</text>
    <text class="node-text" x="585" y="399">Appointments</text>
    <text class="node-text" x="585" y="432">Diagnostics</text>
    <text class="node-text" x="585" y="465">Reports</text>
    <text class="node-text" x="585" y="498">Payments</text>
    <text class="node-text" x="585" y="531">Navigation API</text>
    <text class="node-text" x="585" y="564">Admin API</text>
    <rect class="pill" x="585" y="594" width="120" height="30" rx="15"/>
    <text class="tag" x="607" y="614">App VM</text>

    <rect class="card-data" x="805" y="215" width="175" height="118" rx="17"/>
    <text class="node-title" x="832" y="252">PostgreSQL</text>
    <text class="node-text" x="832" y="284">Patients, queues,</text>
    <text class="node-text" x="832" y="310">appointments</text>

    <rect class="card-data" x="805" y="360" width="175" height="112" rx="17"/>
    <text class="node-title" x="832" y="397">Object store</text>
    <text class="node-text" x="832" y="429">Reports, referrals,</text>
    <text class="node-text" x="832" y="455">receipts, IDs</text>

    <rect class="card-data" x="805" y="500" width="175" height="112" rx="17"/>
    <text class="node-title" x="832" y="537">Vector store</text>
    <text class="node-text" x="832" y="569">Qdrant / ChromaDB</text>
    <text class="node-text" x="832" y="594">RAG knowledge base</text>

    <rect class="card-govern" x="805" y="640" width="175" height="112" rx="17"/>
    <text class="node-title" x="832" y="677">PHI gateway</text>
    <text class="node-text" x="832" y="709">Consent, redaction,</text>
    <text class="node-text" x="832" y="735">audit, encryption</text>

    <rect class="card-local" x="1050" y="220" width="190" height="160" rx="18"/>
    <text class="node-title" x="1080" y="256">Local AI server</text>
    <text class="node-text" x="1080" y="288">vLLM / Ollama / TGI</text>
    <text class="node-text" x="1080" y="316">Llama 3.3 70B</text>
    <text class="node-text" x="1080" y="344">Qwen3 / Mistral</text>
    <rect class="pill-blue" x="1080" y="356" width="130" height="28" rx="14"/>
    <text class="tag" x="1098" y="375">No PHI leaves</text>

    <rect class="card-cloud" x="1050" y="425" width="190" height="195" rx="18"/>
    <text class="node-title" x="1080" y="461">Cloud PHI AI</text>
    <text class="node-text" x="1080" y="493">OpenAI / Claude</text>
    <text class="node-text" x="1080" y="521">Azure OpenAI</text>
    <text class="node-text" x="1080" y="549">AWS Bedrock</text>
    <text class="node-text" x="1080" y="577">Vertex AI</text>
    <rect class="pill-purple" x="1080" y="590" width="130" height="28" rx="14"/>
    <text class="tag" x="1102" y="609">BAA / DPA</text>

    <rect class="card" x="1315" y="220" width="225" height="104" rx="17"/>
    <text class="node-title" x="1345" y="254">OPD scheduling</text>
    <text class="node-text" x="1345" y="284">DMG days, slots,</text>
    <text class="node-text" x="1345" y="310">token series</text>

    <rect class="card" x="1315" y="355" width="225" height="104" rx="17"/>
    <text class="node-title" x="1345" y="389">Lab / radiology</text>
    <text class="node-text" x="1345" y="419">CT, MRI, biopsy,</text>
    <text class="node-text" x="1345" y="445">sample reports</text>

    <rect class="card" x="1315" y="490" width="225" height="104" rx="17"/>
    <text class="node-title" x="1345" y="524">Navigation layer</text>
    <text class="node-text" x="1345" y="554">QR/geotag route graph</text>
    <text class="node-text" x="1345" y="580">indoor directions</text>

    <rect class="card" x="1315" y="625" width="225" height="104" rx="17"/>
    <text class="node-title" x="1345" y="659">Messaging / billing</text>
    <text class="node-text" x="1345" y="689">WhatsApp, SMS, email,</text>
    <text class="node-text" x="1345" y="715">receipts, payments</text>
  </g>

  <path class="arrow" d="M250 274 C282 274 288 350 318 350"/>
  <path class="arrow-soft" d="M250 414 C282 414 288 386 318 386"/>
  <path class="arrow-soft" d="M250 554 C282 554 288 421 318 421"/>
  <path class="arrow" d="M488 360 C520 360 524 375 555 375"/>
  <path class="arrow" d="M735 363 C770 363 770 274 805 274"/>
  <path class="arrow-soft" d="M735 463 C770 463 770 416 805 416"/>
  <path class="arrow-soft" d="M735 532 C770 532 770 556 805 556"/>
  <path class="arrow" d="M980 696 C1015 696 1015 300 1050 300"/>
  <path class="arrow-purple" d="M980 696 C1015 696 1015 522 1050 522"/>
  <path class="arrow-soft" d="M1240 300 C1275 300 1280 272 1315 272"/>
  <path class="arrow-soft" d="M1240 522 C1275 522 1280 407 1315 407"/>
  <path class="arrow-soft" d="M980 556 C1010 556 1015 762 1288 762 C1310 762 1290 542 1315 542"/>
  <path class="arrow-soft" d="M735 498 C1040 498 1080 675 1315 675"/>

  <rect class="card-soft" x="80" y="802" width="1440" height="72" rx="18"/>
  <text class="stack" x="110" y="830">Proposed stack:</text>
  <text class="node-text" x="250" y="830">PWA/React · Nginx/WAF · Python FastAPI · PostgreSQL + PostGIS · Object storage · Qdrant/ChromaDB · PHI gateway</text>
  <text class="node-text" x="250" y="858">Local AI: vLLM/Ollama with Llama/Qwen/Mistral · Cloud PHI AI: OpenAI/Claude/Azure OpenAI/AWS Bedrock/Vertex AI with consent, audit and encryption</text>
</svg>
