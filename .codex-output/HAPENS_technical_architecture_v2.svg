<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">HAPENS technical architecture: local AI with an optional cloud deployment</title>
  <desc id="description">Proposed architecture. Patient, admin and kiosk interfaces connect through Nginx to the FastAPI backend. The backend connects to hospital services, hospital data and the HAPENS AI gateway. Approved knowledge feeds the AI gateway. The gateway uses either a local vLLM server with Qwen3-32B or Llama 3.3 70B Instruct, or an approved Azure OpenAI GPT-4.1 deployment. The backend validates and executes all booking actions. Double-headed arrows show request and response paths. Cloud processing of protected health information requires hospital-approved contractual, regional and retention settings.</desc>
  <metadata>Model references: https://huggingface.co/Qwen/Qwen3-32B ; https://huggingface.co/meta-llama/Llama-3.3-70B-Instruct ; https://developers.openai.com/api/docs/models/gpt-4.1 ; https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy . Diagram is a proposed architecture, not a statement of implemented production capabilities.</metadata>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .title { font-size: 46px; font-weight: 700; fill: #123e3d; }
      .subtitle { font-size: 22px; fill: #54716f; }
      .section { font-size: 21px; font-weight: 700; fill: #254e4c; }
      .number { font-size: 15px; font-weight: 700; fill: #08716c; }
      .heading { font-size: 25px; font-weight: 700; fill: #173e3d; }
      .body { font-size: 19px; fill: #496461; }
      .detail { font-size: 17px; fill: #526d6a; }
      .label { font-size: 15px; font-weight: 700; fill: #5e7774; }
      .row-title { font-size: 20px; font-weight: 700; fill: #254e4c; }
      .white { fill: #ffffff; }
      .muted-white { fill: #d1eae6; }
      .card { fill: #ffffff; stroke: #c4d7d4; stroke-width: 1.6; }
      .separator { stroke: #dce7e4; stroke-width: 1.2; }
      .edge { fill: none; stroke: #15766f; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
      .exchange { marker-start: url(#teal-arrow); marker-end: url(#teal-arrow); }
      .blue-edge { stroke: #3575a3; marker-start: url(#blue-arrow); marker-end: url(#blue-arrow); }
      .cloud-edge { stroke: #a65d73; stroke-dasharray: 7 6; marker-start: url(#rose-arrow); marker-end: url(#rose-arrow); }
    </style>
    <marker id="teal-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#15766f"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#3575a3"/>
    </marker>
    <marker id="rose-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#a65d73"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#f9fcfb"/>
  <rect x="0" y="0" width="1920" height="8" fill="#116d66"/>
  <text class="title" x="64" y="83">HAPENS Technical Architecture</text>
  <text class="subtitle" x="64" y="123">Connected patient services, hospital-controlled data and flexible AI deployment</text>
  <text class="label" x="1856" y="68" text-anchor="end">PROPOSED ARCHITECTURE</text>
  <text class="detail" x="1856" y="99" text-anchor="end">Local first. Cloud by approval.</text>
  <line class="separator" x1="64" y1="157" x2="1856" y2="157"/>

  <g>
    <text class="number" x="64" y="210">01</text><text class="section" x="101" y="210">Patient &amp; staff</text>
    <text class="number" x="434" y="210">02</text><text class="section" x="471" y="210">Secure entry</text>
    <text class="number" x="802" y="210">03</text><text class="section" x="839" y="210">Application backend</text>
    <text class="number" x="1364" y="210">04</text><text class="section" x="1401" y="210">Hospital services</text>
  </g>

  <g data-node="patient">
    <rect class="card" x="64" y="248" width="290" height="92" rx="8"/>
    <text class="heading" x="88" y="285">Patient app</text>
    <text class="body" x="88" y="315">Mobile web / PWA</text>
  </g>
  <g data-node="admin">
    <rect class="card" x="64" y="366" width="290" height="92" rx="8"/>
    <text class="heading" x="88" y="403">Admin console</text>
    <text class="body" x="88" y="433">Registration &amp; slot control</text>
  </g>
  <g data-node="kiosk">
    <rect class="card" x="64" y="484" width="290" height="92" rx="8"/>
    <text class="heading" x="88" y="521">Displays &amp; kiosks</text>
    <text class="body" x="88" y="551">Tokens &amp; wayfinding</text>
  </g>

  <g data-node="entry">
    <rect x="434" y="298" width="276" height="228" rx="8" fill="#eef7f4" stroke="#9ac5bb" stroke-width="1.6"/>
    <text class="heading" x="460" y="339">Nginx gateway</text>
    <text class="body" x="460" y="378">HTTPS / TLS</text>
    <text class="body" x="460" y="413">Firewall &amp; rate limits</text>
    <text class="body" x="460" y="448">Hospital VLAN / DMZ</text>
    <line x1="460" y1="470" x2="684" y2="470" stroke="#c7ded7" stroke-width="1.2"/>
    <text class="detail" x="460" y="502">Authenticated access</text>
  </g>

  <g data-node="backend">
    <rect x="802" y="248" width="430" height="328" rx="8" fill="#115f5a"/>
    <text class="heading white" x="830" y="292">FastAPI backend</text>
    <text class="body muted-white" x="830" y="326">Python + Uvicorn</text>
    <line x1="830" y1="349" x2="1204" y2="349" stroke="#468780" stroke-width="1.2"/>
    <text class="body white" x="830" y="386">Login, enrolment &amp; staff permissions</text>
    <text class="body white" x="830" y="422">Availability checks &amp; booking rules</text>
    <text class="body white" x="830" y="458">Reports, payments &amp; navigation APIs</text>
    <line x1="830" y1="482" x2="1204" y2="482" stroke="#468780" stroke-width="1.2"/>
    <text class="row-title white" x="830" y="516">Confirmed actions execute here</text>
    <text class="detail muted-white" x="830" y="548">Patient confirmation + server validation</text>
  </g>

  <g data-node="services">
    <rect class="card" x="1364" y="248" width="492" height="328" rx="8"/>
    <text class="row-title" x="1392" y="281">Appointments &amp; tokens</text>
    <text class="detail" x="1392" y="307">DMG days, available slots &amp; calling queues</text>
    <line class="separator" x1="1392" y1="328" x2="1828" y2="328"/>
    <text class="row-title" x="1392" y="361">Diagnostics &amp; reports</text>
    <text class="detail" x="1392" y="387">CT, MRI, laboratory status &amp; downloads</text>
    <line class="separator" x1="1392" y1="408" x2="1828" y2="408"/>
    <text class="row-title" x="1392" y="441">Hospital navigation</text>
    <text class="detail" x="1392" y="467">QR checkpoints, geotags &amp; indoor route graph</text>
    <line class="separator" x1="1392" y1="488" x2="1828" y2="488"/>
    <text class="row-title" x="1392" y="521">Billing &amp; notifications</text>
    <text class="detail" x="1392" y="547">Receipts, payment status &amp; reminders</text>
  </g>

  <g data-node="data">
    <rect x="64" y="692" width="646" height="252" rx="8" fill="#fffaf0" stroke="#d8c18a" stroke-width="1.6"/>
    <text class="heading" x="90" y="734">Hospital data &amp; knowledge</text>
    <line x1="90" y1="754" x2="684" y2="754" stroke="#e8dbb9" stroke-width="1.2"/>
    <text class="row-title" x="90" y="791">PostgreSQL + PostGIS</text>
    <text class="detail" x="377" y="791">Patients, bookings, route graph</text>
    <text class="row-title" x="90" y="839">Encrypted file store</text>
    <text class="detail" x="377" y="839">Reports, referrals &amp; ID documents</text>
    <text class="row-title" x="90" y="887">ChromaDB</text>
    <text class="detail" x="377" y="887">Approved hospital knowledge</text>
    <text class="detail" x="90" y="921">Hospital-managed storage, access controls &amp; backups</text>
  </g>

  <g data-node="ai-gateway">
    <rect x="802" y="692" width="430" height="252" rx="8" fill="#f0f5fa" stroke="#abc5d9" stroke-width="1.6"/>
    <text class="heading" x="830" y="734">HAPENS AI gateway</text>
    <text class="body" x="830" y="768">RAG + model routing</text>
    <line x1="830" y1="790" x2="1204" y2="790" stroke="#d0dfea" stroke-width="1.2"/>
    <text class="body" x="830" y="822">Minimum-necessary patient context</text>
    <text class="body" x="830" y="853">Consent, redaction &amp; audit logging</text>
    <text class="body" x="830" y="884">Validated actions via the backend</text>
    <text class="detail" x="830" y="921">Local default; approved cloud alternative</text>
  </g>

  <g data-node="local-ai">
    <rect x="1364" y="662" width="492" height="156" rx="8" fill="#eff6fc" stroke="#92b6d0" stroke-width="1.6"/>
    <text class="heading" x="1392" y="700">Local AI server</text>
    <text class="label" x="1828" y="698" text-anchor="end" style="fill:#3575a3">ON-PREMISE</text>
    <text class="row-title" x="1392" y="739">Qwen3-32B</text>
    <text class="detail" x="1392" y="763">Local option 1</text>
    <line x1="1610" y1="719" x2="1610" y2="765" stroke="#c0d5e5" stroke-width="1.2"/>
    <text class="row-title" x="1634" y="739">Llama 3.3 70B</text>
    <text class="detail" x="1634" y="763">Instruct / Local option 2</text>
    <text class="detail" x="1392" y="798">vLLM runtime | Inference on hospital GPU server</text>
  </g>

  <g data-node="cloud-ai">
    <rect x="1364" y="844" width="492" height="116" rx="8" fill="#fcf3f5" stroke="#d5a8b6" stroke-width="1.6"/>
    <text class="row-title" x="1392" y="875">Cloud AI for PHI*</text>
    <text class="label" x="1828" y="875" text-anchor="end" style="fill:#9b526a">OPTIONAL</text>
    <text class="heading" x="1392" y="910">GPT-4.1 on Azure OpenAI</text>
    <text class="detail" x="1392" y="940">Hospital-approved region, retention &amp; contract</text>
  </g>

  <!-- Connectors stay in the open gutters. Branches share only intentional junctions. -->
  <g id="connectors">
    <path data-edge="patient-entry" class="edge" d="M357 294 H394 V412" marker-start="url(#teal-arrow)"/>
    <path data-edge="admin-entry" class="edge" d="M357 412 H394" marker-start="url(#teal-arrow)"/>
    <path data-edge="kiosk-entry" class="edge" d="M357 530 H394 V412" marker-start="url(#teal-arrow)"/>
    <path data-edge="access-trunk" class="edge" d="M394 412 H431" marker-end="url(#teal-arrow)"/>
    <circle cx="394" cy="412" r="4" fill="#15766f"/>
    <path data-edge="entry-backend" class="edge exchange" d="M713 412 H799"/>
    <path data-edge="backend-services" class="edge exchange" d="M1235 412 H1361"/>
    <path data-edge="backend-data" class="edge exchange" d="M890 579 V620 H387 V689"/>
    <path data-edge="backend-ai" class="edge blue-edge" d="M1120 579 V689"/>
    <path data-edge="data-ai" class="edge exchange" d="M713 866 H799"/>
    <path data-edge="ai-local" class="edge blue-edge" d="M1235 752 H1298 V740 H1361"/>
    <path data-edge="ai-cloud" class="edge cloud-edge" d="M1235 877 H1298 V902 H1361"/>
  </g>

  <g id="connector-labels">
    <text class="label" x="756" y="391" text-anchor="middle">API</text>
    <text class="label" x="1298" y="391" text-anchor="middle">Services</text>
    <text class="label" x="616" y="608" text-anchor="middle">Records &amp; files</text>
    <text class="label" x="1136" y="632" style="fill:#3575a3">AI requests</text>
    <text class="label" x="1136" y="653" style="fill:#3575a3">&amp; responses</text>
    <text class="label" x="756" y="847" text-anchor="middle">RAG</text>
    <text class="label" x="1298" y="719" text-anchor="middle" style="fill:#3575a3">Local</text>
    <text class="label" x="1298" y="854" text-anchor="middle" style="fill:#9b526a">Cloud</text>
  </g>

  <line class="separator" x1="64" y1="984" x2="1856" y2="984"/>
  <text class="label" x="64" y="1016" style="fill:#126c64">STACK</text>
  <text class="body" x="140" y="1016">HTML / CSS / JavaScript PWA | Nginx | FastAPI | PostgreSQL + PostGIS | ChromaDB | vLLM | Azure OpenAI</text>
  <text x="64" y="1050" font-size="15" fill="#5b7470">*PHI: protected health information. Cloud processing requires approved contractual, regional and retention settings.</text>
  <path class="edge exchange" d="M1520 1045 H1558"/>
  <text x="1571" y="1050" font-size="15" fill="#5b7470">Request / response</text>
  <path class="edge cloud-edge" d="M1738 1045 H1774"/>
  <text x="1787" y="1050" font-size="15" fill="#5b7470">Optional</text>
</svg>
